    <!-- Set the theme before first paint to prevent a flash of the wrong colour scheme.
         Resolution rule must stay in sync with resolveTheme() in ThemeContext.jsx. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('torqued.theme');
          if (m !== 'light' && m !== 'dark') m = 'system';
          var dark = m === 'dark' ||
            (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
