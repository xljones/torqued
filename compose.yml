services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend-src:/app
      - ./pyproject.toml:/app/pyproject.toml
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # No DATABASE_URL: the app uses SQLite. DB_PATH points at the bind-mounted
      # data/ dir (backend-src is mounted at /app, so the default path resolver
      # can't find it). Set DATABASE_URL in .env to use PostgreSQL instead.
      DB_PATH: /app/data/garage.db
      FLASK_DEBUG: "1"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-src:/app/frontend-src
      - ./frontend-src/index.html:/app/frontend-src/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./vitest.config.js:/app/vitest.config.js
      - ./eslint.config.js:/app/eslint.config.js
      - ./dist:/app/dist
    environment:
      API_URL: http://backend:5001
    depends_on:
      - backend
