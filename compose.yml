services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: torqued
      POSTGRES_PASSWORD: torqued
      POSTGRES_DB: torqued
    # Host port 5433 (→ container 5432) avoids clashing with a local Postgres on
    # 5432. The backend reaches the database over the compose network as `db`.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U torqued -d torqued"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend-src:/app
      - ./pyproject.toml:/app/pyproject.toml
      - ./data:/app/data
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://torqued:torqued@db:5432/torqued
      FLASK_DEBUG: "1"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-src:/app/frontend-src
      - ./frontend-src/index.html:/app/frontend-src/index.html
      - ./vite.config.js:/app/vite.config.js
      - ./vitest.config.js:/app/vitest.config.js
      - ./eslint.config.js:/app/eslint.config.js
      - ./dist:/app/dist
    environment:
      API_URL: http://backend:5001
    depends_on:
      - backend

volumes:
  pgdata:
