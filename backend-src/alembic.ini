# Alembic configuration.
#
# The database URL is intentionally left blank: migrations/env.py resolves it
# from the application configuration (DATABASE_URL / DB_PATH) via
# torqued.db.database_url(), so there is a single source of truth. Run from
# backend-src/, e.g.  `alembic revision -m "add table"`  or  `alembic upgrade head`.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =
